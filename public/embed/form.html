<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Request a quote</title>
  <link rel="stylesheet" href="./hosted.css">
</head>
<body class="cms-hosted">
  <!--
    Hosted lead-capture form (token link). The clean public link is
    /quote/<company-slug>/<form-slug>, served by /api/public/embed/hosted
    with the same layout. This page stays for existing links and for the
    admin previews:
      ?token=<embed_token>&slug=<form slug>
      &preview=1  renders the saved form but never submits
      &compact=1  form only, no page chrome (admin iframes)
  -->
  <div id="hp-preview-bar" class="hp-preview-bar" hidden>Preview: this shows your saved form exactly as visitors see it. Submitting here will not create a lead.</div>
  <main class="hp">
    <aside id="hp-brand" class="hp-brand"></aside>
    <section class="hp-form">
      <div class="hp-form-inner" id="hp-mount"></div>
      <p class="hp-powered">Powered by <a href="https://cateringms.com" rel="noopener" target="_blank">CateringMS</a></p>
    </section>
  </main>
  <script src="./hosted.js"></script>
</body>
</html>
