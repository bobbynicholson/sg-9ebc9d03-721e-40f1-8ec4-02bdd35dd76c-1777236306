# Fallback payment/background scheduler. Set the same private CRON_SECRET
# in GitHub Actions secrets and the deployment environment.
name: cron-fallback
on:
  schedule:
    - cron: "*/15 * * * *"   # frequent group
    - cron: "0 * * * *"      # hourly group
    - cron: "30 2 * * *"     # daily maintenance group (04:30 SAST)
    - cron: "0 6 * * *"      # daily morning reminders (08:00 SAST)
    - cron: "0 3 * * 0"      # weekly archive group (Sunday)
  workflow_dispatch: {}

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger cron endpoints
        env:
          BASE: https://cateringms.com/api/cron
          SECRET: ${{ secrets.CRON_SECRET }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$SECRET" ]; then echo "Repository CRON_SECRET is not configured"; exit 1; fi
          hit() {
            for ep in "$@"; do
              code=$(curl -s -o /tmp/out -w "%{http_code}" -m 120 -H "Authorization: Bearer $SECRET" "$BASE/$ep" || echo "000")
              echo "$ep -> $code $(head -c 200 /tmp/out)"
            done
          }
          FREQ="reconcile-payment-events reconcile-payment-attempts reconcile-payfast process-email-queue whatsapp-drain check-en-route late-event-check missed-clock-in-check driver-missed-clock-in-check cleaning-missed-clock-in-check process-pending-reviews order-stage-notify order-sla-monitor event-approaching-reminder waiter-service-reminder"
          HOURLY="auto-complete-delivered deposit-paid-sweeper verify-pending-domains outsource-pre-event-reminder"
          DAILY_MAINT="money-reconciliation-check currency-check equipment-service-due update-overdue-invoices expire-stale-quotes prune-api-key-rate-limits advance-fixed-cost-next-due recurring-invoices cleaning-overdue-check late-equipment-return-alert"
          DAILY_MORNING="deposit-reminder balance-reminder quote-followup-send stale-shopping-list-alert expire-trials batch-expiry-alert equipment-collection-reminder outsource-post-event-thanks stale-lead-digest"
          WEEKLY="archive-old-gps-logs archive-old-notifications archive-old-email-rows"
          case "$EVENT_SCHEDULE" in
            "*/15 * * * *") hit $FREQ ;;
            "0 * * * *")    hit $HOURLY ;;
            "30 2 * * *")   hit $DAILY_MAINT ;;
            "0 6 * * *")    hit $DAILY_MORNING ;;
            "0 3 * * 0")    hit $WEEKLY ;;
            "")             hit $FREQ $HOURLY ;;  # manual dispatch: fire the live-ops groups
          esac
